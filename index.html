  function validateStudent(values,data,exceptId=''){
    if(values.name.length<2||values.name.length>120)throw new Error('Le nom doit contenir entre 2 et 120 caract\u00e8res.');
    if(!values.matricule||values.matricule.length>50)throw new Error('Saisissez un matricule de 1 \u00e0 50 caract\u00e8res.');
    if(data.students.some(s=>s.id!==exceptId&&norm(s.matricule)===norm(values.matricule)))throw new Error('Ce matricule existe d\u00e9j\u00e0, dans un dossier actif ou archiv\u00e9.');
    if(!data.classes.some(c=>c.id===values.classId&&c.active))throw new Error('Choisissez une classe active.');
    assertRosterWritable(values.classId,data);const previous=data.students.find(s=>s.id===exceptId);if(previous)assertRosterWritable(previous.classId,data);
    if(values.section.length>80||values.register.length>30)throw new Error('La section ou le num\u00e9ro de registre est trop long.');
  }
  function toggleArchiveStudent(id){requirePermission('manage');const student=db.students.find(s=>s.id===id);if(!student)return;confirmAction({title:student.active?'Archiver ce dossier ?':'R\u00e9activer ce dossier ?',message:`<strong>${esc(student.name)}</strong> ${student.active?'ne figurera plus dans les nouveaux appels. Son dossier, les appels d\u00e9j\u00e0 ouverts et tout son historique seront conserv\u00e9s.':'figurera \u00e0 nouveau dans les prochains appels de sa classe.'}`,label:student.active?'Archiver':'R\u00e9activer',danger:student.active,onConfirm:async rev=>{const ok=await mutate('archive-student',data=>{const s=data.students.find(x=>x.id===id);if(!s.active&&!getClass(s.classId,data)?.active)throw new Error('R\u00e9affectez d\u2019abord cet \u00e9l\u00e8ve \u00e0 une classe active.');const before=s.active;s.active=!s.active;s.updatedAt=new Date().toISOString();audit(data,'student-archive',id,{before,after:s.active,name:s.name});},'manage','',rev);if(ok)toast('Le dossier a \u00e9t\u00e9 mis \u00e0 jour.');}});}

  function flattenRecords(records){return records.flatMap(r=>r.roster.map(s=>({studentId:s.studentId,name:s.name,matricule:s.matricule,register:s.register,date:r.date,classId:r.classId,className:r.className,session:r.session,status:r.entries[s.studentId]?.status || 'unset',at:r.entries[s.studentId]?.at || '',actor:r.entries[s.studentId]?.actorName || '',validatedAt:r.validatedAt || '',validatedBy:r.validatedBy || '',recordId:r.id,recordStatus:r.status})));}

clair.</p><div class="setting-action"><div><h3>Sauvegarde compl&egrave;te</h3><p>Classes, noms, registres et journal.</p></div>${btn('Sauvegarder','backup','download')}</div>${!remote?`<div class="setting-action"><div><h3>Restaurer une sauvegarde locale</h3><p>Remplacement apr&egrave;s confirmation.</p></div>${btn('Restaurer','restore','upload')}<input type="file" id="restore-file" accept=".json,application/json" class="hidden"></div><div class="setting-action"><div><h3>Limiter l'effacement du navigateur</h3><p>Demander le stockage persistant.</p></div>${btn('Demander','persist-storage','shield')}</div>`:'<p class="small muted mt-4">La restauration du serveur se fait avec le propri&eacute;taire du projet et les sauvegardes PostgreSQL, pas en rempla&ccedil;ant silencieusement le journal depuis le navigateur.</p>'}<div class="setting-action"><div><h3>Diagnostics int&eacute;gr&eacute;s</h3><p>Calculs, verrouillage, historique, CSV et persistance isol&eacute;e.</p></div>${btn('V\u00e9rifier','run-tests','checkCircle')}</div></section></div><div><section class="settings-section"><h2>${remote?'Connexion de l\u2019\u00e9cole':'Ouvrir l\u2019acc\u00e8s aux parents'}</h2><p>${remote?'Les appels sont enregistr&eacute;s dans la base configur&eacute;e. Les parents ne re&ccedil;oivent que les donn&eacute;es de leurs enfants autoris&eacute;s.':'Actuellement, aucun partage entre appareils. Configurez le serveur puis rattachez chaque parent &agrave; son enfant.'}</p>${btn('Configurer / consulter la connexion','connection-settings','link','btn-primary','style="white-space:normal;width:100%"')}${remote?btn('Fichier pour les familles','download-connected-file','download','mt-4','style="width:100%"'):''}</section><section class="settings-section"><h2>R&egrave;gles d'acc&egrave;s</h2><p>Seul un administrateur autoris&eacute; peut cr&eacute;er ou modifier une classe, verrouiller sa liste et faire l'appel. Le format @nom@ n'attribue aucun privil&egrave;ge par lui-m&ecirc;me.</p><div class="note warning">${icon('lock')}${remote?'Les fonctions SQL v&eacute;rifient le compte &agrave; chaque requ&ecirc;te. Le d&eacute;ploiement, les politiques et les tests sur deux comptes distincts restent &agrave; v&eacute;rifier par l\u2019&eacute;cole.':'Le mot de passe local ne prot&egrave;ge pas contre une manipulation du fichier ou du stockage. Le serveur est n&eacute;cessaire pour des permissions v&eacute;rifiables entre plusieurs appareils.'}</div></section><section class="settings-section"><h2>Maladie signal&eacute;e</h2><p>Le statut Malade est saisi volontairement par l'administrateur et compt&eacute; s&eacute;par&eacute;ment. Aucun diagnostic, traitement ou document m&eacute;dical n'est n&eacute;cessaire.</p></section></div></div>`;

  function setupForm(){requirePermission('admin');showModal('D\u00e9marrer votre registre',`<form data-form="setup"><p class="modal-description">Cr&eacute;ez un espace vide, sans aucune donn&eacute;e fictive. Le premier profil sera administrateur <strong>local</strong>, sans authentification s&eacute;curis&eacute;e. Pour un usage r&eacute;el multi-utilisateur, un backend est indispensable.</p><div class="form-grid"><label class="field full"><span>Nom de l'&eacute;tablissement *</span><input name="schoolName" value="${esc(db.settings.schoolName)}" minlength="2" maxlength="120" required autofocus></label><label class="field full"><span>Votre nom complet *</span><input name="adminName" value="${db.mode==='demo'?'':esc(user().name)}" minlength="2" maxlength="100" required placeholder="Nom du premier administrateur local"></label><label class="field full"><span>Ann&eacute;e scolaire *</span><input name="year" value="${esc(schoolYear())}" maxlength="30" required></label><label class="check-label full"><input type="checkbox" name="confirm" required><span>Remplacer les donn&eacute;es actuelles et commencer avec un registre vide.</span></label></div><div class="note warning mt-4">${icon('alert')}Une sauvegarde JSON de l'espace actuel sera t&eacute;l&eacute;charg&eacute;e avant le remplacement. Conservez-la si elle contient des donn&eacute;es importantes.</div><div class="form-actions">${btn('Annuler','close-modal')}<button class="btn btn-primary" type="submit">${icon('arrowRight')}Cr&eacute;er mon espace local</button></div></form>`,{context:{type:'setup'}});}
  function helpModal(){showModal('Bien d&eacute;marrer avec votre registre',`<div class="note">${icon('info')}Cette application est une d&eacute;monstration locale compl&egrave;te, pas un service scolaire connect&eacute;.</div><h3 class="mt-6">Ouvrir le fichier sur Android</h3><p class="modal-description mt-2">Enregistrez <strong>index.html</strong> dans les fichiers de votre t&eacute;l&eacute;phone. Ouvrez-le avec Chrome ou un navigateur prenant en charge les fichiers HTML locaux. Si Android ne propose qu'un aper&ccedil;u du document, utilisez un h&eacute;bergement HTTPS ou un serveur HTTP local. Gardez le m&ecirc;me navigateur et la m&ecirc;me adresse de fichier.</p><h3>Votre premier appel, pas &agrave; pas</h3><div class="small muted mt-2" style="line-height:2"><p>1. Dans les Param&egrave;tres, d&eacute;marrez un &eacute;tablissement vide.</p><p>2. Cr&eacute;ez vos classes et ajoutez vos profils locaux et leurs affectations.</p><p>3. Inscrivez les &eacute;l&egrave;ves, ou importez un CSV (nom, matricule, classe).</p><p>4. Ouvrez Faire l'appel. Choisissez la classe, la date et la s&eacute;ance.</p><p>5. Renseignez chaque statut. Chaque geste est enregistr&eacute; sur l'appareil.</p><p>6. Validez lorsque tous les statuts sont renseign&eacute;s.</p><p>7. Consultez l'historique et exportez vos rapports et sauvegardes.</p></div><h3 class="mt-6">Persistance et confidentialit&eacute;</h3><p class="modal-description mt-2">Les donn&eacute;es sont stock&eacute;es dans IndexedDB. L'actualisation ne les efface pas. La navigation priv&eacute;e, la suppression des donn&eacute;es du navigateur, un changement d'origine ou de fichier peuvent les rendre indisponibles. Exportez r&eacute;guli&egrave;rement une sauvegarde JSON. Les exports et le stockage local ne sont pas chiffr&eacute;s.</p><h3>Plusieurs onglets, pas plusieurs t&eacute;l&eacute;phones</h3><p class="modal-description mt-2">Une transaction et un num&eacute;ro de version emp&ecirc;chent un onglet de remplacer silencieusement une version plus r&eacute;cente. En cas de conflit, l'op&eacute;ration est refus&eacute;e, les donn&eacute;es sont relues et vous devez r&eacute;essayer. Aucun partage entre appareils et aucune file d'envoi vers un serveur ne sont impl&eacute;ment&eacute;s.</p><h3>Imprimer ou enregistrer en PDF</h3><p class="modal-description mt-2">Dans Rapports, choisissez vos filtres puis Imprimer / PDF. Dans la bo&icirc;te d'impression du navigateur, choisissez <strong>Enregistrer au format PDF</strong> si cette destination est disponible. Aucun faux t&eacute;l&eacute;chargement PDF n'est simul&eacute;.</p><h3>Fonctionnement hors ligne</h3><p class="modal-description mt-2">Le JavaScript et tous les styles n&eacute;cessaires sont int&eacute;gr&eacute;s au fichier. Les polices et Tailwind via CDN sont facultatifs pour l'affichage. Le fichier HTML local reste utilisable sans connexion. Une page h&eacute;berg&eacute;e n'est pas installable hors ligne automatiquement : aucun service worker n'est fourni.</p><h3>S&eacute;curit&eacute; des profils</h3><p class="modal-description mt-2">Le choix d'un profil est local et non v&eacute;rifi&eacute;. Les garde-fous emp&ecirc;chent les erreurs ordinaires dans l'interface, pas les manipulations d'un utilisateur ayant acc&egrave;s au navigateur. La cr&eacute;ation s&eacute;curis&eacute;e du premier administrateur et les permissions opposables doivent &ecirc;tre impl&eacute;ment&eacute;es et v&eacute;rifi&eacute;es sur un serveur avant tout usage scolaire r&eacute;el.</p><div class="form-actions">${btn('J\u2019ai compris','close-modal','','btn-primary')}</div>`,{wide:true});}
  function calculationHelp(){showModal('Comprendre les statistiques',`<p class="modal-description">Les pr&eacute;sents, absents et malades sont calcul&eacute;s pour la date et la s&eacute;ance affich&eacute;es, y compris les appels en cours. Les cartes &Eacute;l&egrave;ves inscrits et Classes montrent les dossiers et classes actifs actuels.</p><div class="note">${icon('chart')}Taux = (pr&eacute;sents + retards) / (pr&eacute;sents + retards + absents).</div><div class="small muted mt-4" style="line-height:1.9"><p><strong>Malades</strong> : les &eacute;l&egrave;ves marqu&eacute;s Malade par un administrateur. Ils sont compt&eacute;s s&eacute;par&eacute;ment des absents ordinaires et des excus&eacute;s.</p><p class="mt-4">Malades, excus&eacute;s et non renseign&eacute;s sont exclus du taux. Sans donn&eacute;es &eacute;ligibles, le taux affiche N/D. Les statuts non renseign&eacute;s ne sont jamais assimil&eacute;s &agrave; des pr&eacute;sences ou des absences.</p><p class="mt-4">Pour un appel existant, le bilan utilise exclusivement sa liste d'&eacute;l&egrave;ves conserv&eacute;e. Aujourd'hui, une classe non commenc&eacute;e affiche ses &eacute;l&egrave;ves actuels comme non renseign&eacute;s. Pour une ancienne date sans registre, la liste de l'&eacute;poque est inconnue : elle n'est pas remplac&eacute;e par la liste actuelle et n'est pas incluse dans les totaux connus.</p><p class="mt-4">Le bilan de l'&eacute;cole est la somme des bilans de classe pour la m&ecirc;me date et la m&ecirc;me s&eacute;ance. Les bilans sur plusieurs s&eacute;ances ou plusieurs jours comptent des &eacute;l&egrave;ves-s&eacute;ances, pas des personnes uniques. Les parents ne voient que les enfants autoris&eacute;s, jamais les totaux de l'&eacute;cole.</p></div><div class="form-actions">${btn('Fermer','close-modal','','btn-primary')}</div>`);}
  function helpDailyWorkflow(){
    helpModal();const body=$('.modal-body',$('#modal'));
    $('.note',body).innerHTML=icon('info')+'<span>Registre fonctionnel, sans donn&eacute;es fictives au d&eacute;marrage. Mode actuel : <strong>'+(connection.mode==='connected'?'serveur de l\u2019&eacute;cole configur&eacute;':'stockage local, sans acc&egrave;s distant des parents')+'</strong>.</span>';

    if(heading){heading.nextElementSibling.innerHTML=`<p>1. Connectez-vous avec votre compte administrateur. Son identifiant peut &ecirc;tre <strong>@nom@</strong>, mais ses droits doivent avoir &eacute;t&eacute; autoris&eacute;s.</p><p>2. Cliquez sur <strong>Cr&eacute;er une classe</strong>. Nommez-la, saisissez l'&eacute;l&egrave;ve 1, l'&eacute;l&egrave;ve 2, et continuez jusqu'au dernier. La touche Entr&eacute;e passe au nom suivant.</p><p>3. Cliquez sur <strong>Enregistrer et verrouiller</strong> : les noms sont conserv&eacute;s et la liste est automatiquement bloqu&eacute;e.</p><p>4. Appuyez sur la classe : sa liste d'appel s'ouvre. Appuyez sur le nom d'un &eacute;l&egrave;ve pour le cocher en vert. Son statut devient Pr&eacute;sent.</p><p>5. Avec le menu &agrave; c&ocirc;t&eacute; du nom, indiquez si n&eacute;cessaire Absent, Malade, En retard ou Excus&eacute;.</p><p>6. Enregistrez la journ&eacute;e et confirmez les non-coch&eacute;s comme absents. Le bilan indique notamment les pr&eacute;sents, les absents et les malades.</p><p>7. Les autres jours utilisent les m&ecirc;mes noms avec de nouveaux statuts. Les anciens appels restent dans <strong>Historique</strong>.</p><p>8. Pour les parents &agrave; domicile, configurez le serveur, distribuez le fichier connect&eacute; ou l'adresse HTTPS de l'&eacute;cole et rattachez chaque compte parent &agrave; ses enfants dans <strong>Personnel</strong>. Aucune recherche publique par nom seul n'est autoris&eacute;e.</p>`;}
    for(const h of $$('h3',body)){if(h.textContent==='S\u00e9curit\u00e9 des profils')h.nextElementSibling.innerHTML='Les mots de passe locaux sont conserv&eacute;s sous forme d\u2019empreintes sal&eacute;es, sans chiffrer le registre. Cette protection n\u2019est pas &eacute;quivalente &agrave; un serveur. En mode connect&eacute;, Supabase Auth v&eacute;rifie les identit&eacute;s et les fonctions SQL contr&ocirc;lent les r&ocirc;les et les liens parent-enfant. Le d&eacute;ploiement et ces r&egrave;gles doivent &ecirc;tre test&eacute;s sur le projet de l\u2019&eacute;cole.';if(h.textContent==='Plusieurs onglets, pas plusieurs t\u00e9l\u00e9phones'){h.textContent='Plusieurs appareils et conflits';h.nextElementSibling.innerHTML='En mode local, seules les fen&ecirc;tres du m&ecirc;me stockage partagent les donn&eacute;es. En mode connect&eacute;, les appareils configur&eacute;s lisent la m&ecirc;me base et les &eacute;critures concurrentes sont refus&eacute;es par version. Aucun envoi diff&eacute;r&eacute; hors ligne n\u2019est impl&eacute;ment&eacute;. Une coupure r&eacute;seau doit &ecirc;tre suivie d\u2019une actualisation avant de r&eacute;essayer.';}}
    const actions=$('.form-actions',body);actions.insertAdjacentHTML('beforebegin','<div class="note warning">'+icon('shield')+'<span>Aucun registre n\u2019expire automatiquement. Mais une conservation sur plusieurs ann&eacute;es ne peut pas &ecirc;tre garantie par un navigateur seul : quotas, panne, perte du t&eacute;l&eacute;phone ou effacement du stockage restent possibles. En mode connect&eacute;, configurez aussi les sauvegardes PostgreSQL et les politiques de conservation. Le JSON du registre ne sauvegarde pas les comptes Supabase Auth ni les autorisations parent-enfant du serveur.</span></div>');
  }
  function downloadFile(filename,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  function csvCell(value){let s=String(value ?? '');if(/^[\s]*[=+@\-]/.test(s)||/^[\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
  function toCSV(headers,rows){return '\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');}
  function downloadCSV(filename,headers,rows){downloadFile(filename,toCSV(headers,rows),'text/csv;charset=utf-8');toast(`${rows.length} ligne${rows.length>1?'s':''} pr\u00e9par\u00e9e${rows.length>1?'s':''} dans le fichier CSV.`);}
  const ROW_HEADERS=['Etablissement','Date','Classe','Seance','IdentifiantEleve','Nom','Matricule','NumeroRegistre','Statut','Horodatage','Personnel','EtatAppel','ValideLe','ValidePar'];
  function rowsToCSV(rows){return rows.map(r=>[db.settings.schoolName,r.date,r.className,r.session,r.studentId,r.name,r.matricule,r.register,STATUS[r.status].label,r.at,r.actor,r.recordStatus==='completed'?'Termin\u00e9':'En cours',r.validatedAt,r.validatedBy]);}
  function exportStudents(){const rows=filteredStudents();downloadCSV('eleves_'+today()+'.csv',['Identifiant','Nom','Matricule','Classe','Section','NumeroRegistre','Statut'],rows.map(s=>[s.id,s.name,s.matricule,className(s.classId),s.section,s.register,s.active?'Actif':'Archiv\u00e9']));}
  function exportRegister(id){const r=db.registers.find(x=>x.id===id);if(!r||!can('read',r.classId))return toast('Ce registre n\u2019est pas accessible.','error');downloadCSV('registre_'+r.date+'_'+norm(r.className).replace(/\W+/g,'_')+'.csv',ROW_HEADERS,rowsToCSV(flattenRecords([r])));}
  function exportHistory(){if(ui.historyFrom>ui.historyTo)return toast('La p\u00e9riode est invalide.','error');if(ui.historyTab==='audit'){requirePermission('audit');const list=db.audit.filter(a=>a.at.slice(0,10)>=ui.historyFrom&&a.at.slice(0,10)<=ui.historyTo&&(!ui.historyClass||a.classId===ui.historyClass));downloadCSV('journal_'+today()+'.csv',['Evenement','Horodatage','Personnel','Action','Entite','Eleve','DateAppel','Classe','Seance','Avant','Apres','Motif'],list.map(a=>[a.id,a.at,a.actorName,AUDIT_LABELS[a.action]||a.action,a.entityId,a.studentId||'',a.date||'',a.className||'',a.session||'',a.before===undefined?'':JSON.stringify(a.before),a.after===undefined?'':JSON.stringify(a.after),a.reason||'']));}else downloadCSV('historique_'+ui.historyFrom+'_'+ui.historyTo+'.csv',ROW_HEADERS,rowsToCSV(flattenRecords(filteredRegisters())));}
  function exportReport(){if(ui.reportFrom>ui.reportTo)return toast('La p\u00e9riode est invalide.','error');const rows=reportRows();if(ui.reportType==='monthly')downloadCSV('bilan_mensuel_'+ui.reportFrom+'.csv',['Etablissement','Mois','IdentifiantEleve','Nom','Matricule','Classe','Presents','Absents','Retards','Excuses','Malades','NonRenseignes','TauxPresence'],monthlyRows(rows).map(r=>[db.settings.schoolName,r.month,r.studentId,r.name,r.matricule,r.className,r.present,r.absent,r.late,r.excused,r.sick,r.unset,rateLabel(r.rate)]));else downloadCSV('rapport_'+ui.reportType+'_'+ui.reportFrom+'.csv',ROW_HEADERS,rowsToCSV(rows));}
  function exportStudentHistory(id){if(ui.detailFrom>ui.detailTo)return toast('La p\u00e9riode est invalide.','error');const rows=flattenRecords(visibleRegisters().filter(r=>r.date>=ui.detailFrom&&r.date<=ui.detailTo)).filter(r=>r.studentId===id);downloadCSV('historique_eleve_'+id+'.csv',ROW_HEADERS,rowsToCSV(rows));}
  function printReport(){if(ui.reportFrom>ui.reportTo)return toast('La p\u00e9riode est invalide.','error');const rows=reportRows(),counts=rowCounts(rows),monthly=ui.reportType==='monthly';$('#print-area').innerHTML=`<div class="print-heading">${logo()}<div><h1>${esc(db.settings.schoolName)}</h1><p>Ann&eacute;e scolaire ${esc(db.settings.year)}</p><p>${REPORT_NAMES[ui.reportType]} | ${dateLabel(ui.reportFrom)} au ${dateLabel(ui.reportTo)}</p><p>Classe : ${ui.reportClass?esc(className(ui.reportClass)):'Toutes les classes autoris&eacute;es'} | S&eacute;ance : ${esc(ui.reportSession||'Toutes')} | &Eacute;dit&eacute; par ${esc(user().name)}</p></div></div><div class="print-totals">${[...MARKED_STATUSES,'unset'].map(k=>`<span>${STATUS[k].plural} : <strong>${counts[k]}</strong></span>`).join('')}<span>Taux : <strong>${rateLabel(counts.rate)}</strong></span></div>${reportTable(monthly?monthlyRows(rows):rows,monthly,true)}<div class="print-footer">Taux = (pr&eacute;sents + retards) / (pr&eacute;sents + retards + absents). Malades, excus&eacute;s et non renseign&eacute;s exclus. Totaux par &eacute;l&egrave;ve-s&eacute;ance ; appels en cours inclus. Source : ${connection.mode==='connected'?'base de l\u2019&eacute;cole configur&eacute;e':'stockage local de cet appareil'}. Document g&eacute;n&eacute;r&eacute; le ${stampLabel(new Date().toISOString())}.</div>`;toast('Choisissez Enregistrer au format PDF dans la bo\u00eete d\u2019impression, si disponible.','info');setTimeout(()=>window.print(),120);}
  function backupData(data=db){downloadFile('sauvegarde_ig2_'+today()+'_'+Date.now()+'.json',JSON.stringify({format:'ig2-backup',schema:1,exportedAt:new Date().toISOString(),data},null,2),'application/json');}
  function exportBackup(){requirePermission('admin');backupData();toast('Sauvegarde JSON pr\u00e9par\u00e9e. Conservez ce fichier confidentiel en lieu s\u00fbr.');}
  function detectDelimiter(text){const count={';':0,',':0,'\t':0};let quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){i++;continue;}quoted=!quoted;}else if(!quoted){if(c==='\n'||c==='\r')break;if(c in count)count[c]++;}}return Object.keys(count).sort((a,b)=>count[b]-count[a])[0];}
  function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');const delimiter=detectDelimiter(text),rows=[];let row=[],value='',quoted=false,closed=false;const pushCell=()=>{row.push(value.trim());value='';closed=false;};const pushRow=()=>{pushCell();if(row.some(v=>v!==''))rows.push(row);row=[];if(rows.length>10001)throw new Error('Import limit\u00e9 \u00e0 10 000 \u00e9l\u00e8ves.');};for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){value+='"';i++;}else{quoted=false;closed=true;}}else value+=c;}else if(c===delimiter)pushCell();else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;pushRow();}else if(c==='"'){if(value.trim() || closed)throw new Error('Guillemets CSV mal plac\u00e9s.');value='';quoted=true;}else if(closed){if(!/\s/.test(c))throw new Error('Contenu inattendu apr\u00e8s un champ entre guillemets.');}else value+=c;}if(quoted)throw new Error('Un champ CSV entre guillemets n\u2019est pas ferm\u00e9.');if(value || row.length || closed)pushRow();if(rows.length<2)throw new Error('Le fichier doit contenir une ligne d\u2019en-t\u00eate et au moins un \u00e9l\u00e8ve.');return {headers:rows[0],rows:rows.slice(1),delimiter};}
  function prepareImport(parsed,targetClass=''){

create or replace function public.ig2_require_access(p_role text default null)
returns public.ig2_accounts language plpgsql security definer set search_path='' as $$
declare account public.ig2_accounts;
begin
  if auth.uid() is null or not exists(select 1 from auth.users where id=auth.uid() and email_confirmed_at is not null) then

  end if;
  select * into account from public.ig2_accounts where user_id=auth.uid() and active;
  if not found or (p_role is not null and account.role<>p_role) then raise exception 'Access denied' using errcode='42501'; end if;

end; $$;

  select * into account from public.ig2_accounts where user_id=auth.uid();
  if found and not account.active then raise exception 'Account disabled' using errcode='42501'; end if;
  select * into invitation from public.ig2_admin_allowlist where email=verified_email and active;
  if invitation.email is not null then
    if lower(btrim(p_handle))<>lower(invitation.handle) then raise exception 'Approved administrator identifier required' using errcode='42501'; end if;
    display_name=left(coalesce(nullif(btrim(p_name),''),invitation.handle),100);
    insert into public.ig2_accounts(user_id,name,handle,role) values(auth.uid(),display_name,invitation.handle,'admin')
      on conflict(user_id) do update set role='admin',handle=excluded.handle;
  elsif account.user_id is null then
    if char_length(btrim(p_name))<2 then raise exception 'Your full name is required'; end if;
    insert into public.ig2_accounts(user_id,name,role) values(auth.uid(),left(btrim(p_name),100),'parent');
  elsif account.role='admin' then
    raise exception 'Administrator authorization has been removed' using errcode='42501';
  end if;
  select * into account from public.ig2_accounts where user_id=auth.uid();
  return jsonb_build_object('id',account.user_id,'name',account.name,'handle',account.handle,'role',account.role,'active',account.active,'classIds','[]'::jsonb);
end; $$;

create or replace function public.ig2_read_state() returns jsonb language plpgsql security definer set search_path='' as $$
declare account public.ig2_accounts; result jsonb;
begin
  account=public.ig2_require_access('admin');
  select payload into result from public.ig2_registry where id=1;
  return result;
end; $$;

create or replace function public.ig2_commit_state(p_expected bigint,p_payload jsonb)
returns jsonb language plpgsql security definer set search_path='' as $$
declare account public.ig2_accounts; previous jsonb; next_state jsonb=p_payload; current_revision bigint=-1;
  collection text; entry jsonb; old_record jsonb; new_record jsonb; old_class jsonb; new_class jsonb;
  old_roster jsonb; new_roster jsonb; status_entry record; index_record integer; audit_index integer;
  timestamp_now text=to_char(clock_timestamp() at time zone 'UTC','YYYY-MM-DD"T"HH24:MI:SS.MS"Z"');
  changes jsonb='[]'::jsonb; validated jsonb;
begin
  account=public.ig2_require_access('admin');
  perform pg_advisory_xact_lock(947201);
  select payload,revision into previous,current_revision from public.ig2_registry where id=1 for update;
  if not found then current_revision=-1; end if;
  if current_revision<>p_expected then raise exception 'CONFLICT: reload before saving' using errcode='PT409'; end if;
  if next_state->>'schema' is distinct from '1' or next_state->>'mode' is distinct from 'local' or not coalesce(next_state->>'spaceId' ~ '^[A-Za-z0-9_-]{1,100}$',false) then raise exception 'Invalid registry format'; end if;
  foreach collection in array array['classes','students','users','registers','audit','followUps'] loop
    if jsonb_typeof(next_state->collection) is distinct from 'array' then raise exception 'Invalid collection: %',collection; end if;
    if exists(select 1 from jsonb_array_elements(next_state->collection) x where x->>'id' is null or not (x->>'id' ~ '^[A-Za-z0-9_-]{1,100}$') or x->>'id' in ('__proto__','constructor','prototype')) then raise exception 'Invalid identifiers'; end if;
    if (select count(*)<>count(distinct x->>'id') from jsonb_array_elements(next_state->collection) x) then raise exception 'Duplicate identifiers'; end if;
  end loop;
  if previous is not null and previous->>'spaceId'<>next_state->>'spaceId' then raise exception 'Registry replacement is not allowed through this API'; end if;
  if char_length(coalesce(next_state#>>'{settings,schoolName}','')) not between 2 and 120 then raise exception 'Invalid school name'; end if;
  if jsonb_typeof(next_state#>'{settings,sessions}') is distinct from 'array' or jsonb_array_length(next_state#>'{settings,sessions}') not between 1 and 10 then raise exception 'Invalid sessions'; end if;
  for entry in select value from jsonb_array_elements(next_state->'classes') loop
    if char_length(coalesce(entry->>'name','')) not between 1 and 60 or jsonb_typeof(entry->'active') is distinct from 'boolean' then raise exception 'Invalid class'; end if;
  end loop;
  if not exists(select 1 from jsonb_array_elements(next_state->'users') u where u->>'id'=auth.uid()::text) then raise exception 'The recording administrator must be identified'; end if;
  if (select count(*)<>count(distinct lower(btrim(x->>'matricule'))) from jsonb_array_elements(next_state->'students') x) then raise exception 'Duplicate student numbers'; end if;
  if (select count(*)<>count(distinct lower(btrim(x->>'name'))) from jsonb_array_elements(next_state->'classes') x) then raise exception 'Duplicate class names'; end if;
  for entry in select value from jsonb_array_elements(next_state->'students') loop
    if char_length(coalesce(entry->>'name','')) not between 2 and 120 or char_length(coalesce(entry->>'matricule','')) not between 1 and 50 or jsonb_typeof(entry->'active') is distinct from 'boolean' then raise exception 'Invalid student'; end if;
    if not exists(select 1 from jsonb_array_elements(next_state->'classes') c where c->>'id'=entry->>'classId') then raise exception 'Unknown class'; end if;
  end loop;
  if previous is not null then
    foreach collection in array array['classes','students'] loop
      if exists(select 1 from jsonb_array_elements(previous->collection) old_item where not exists(select 1 from jsonb_array_elements(next_state->collection) new_item where new_item->>'id'=old_item->>'id')) then raise exception 'Archive instead of deleting records'; end if;
    end loop;
    for old_class in select value from jsonb_array_elements(previous->'classes') where value->>'rosterLocked'='true' loop
      select value into new_class from jsonb_array_elements(next_state->'classes') where value->>'id'=old_class->>'id';
      select coalesce(jsonb_agg(x-'updatedAt' order by x->>'id'),'[]'::jsonb) into old_roster from jsonb_array_elements(previous->'students') x where x->>'classId'=old_class->>'id';
      select coalesce(jsonb_agg(x-'updatedAt' order by x->>'id'),'[]'::jsonb) into new_roster from jsonb_array_elements(next_state->'students') x where x->>'classId'=old_class->>'id';
      if old_roster<>new_roster then raise exception 'Class list is locked. Unlock first.' using errcode='42501'; end if;
      if new_class->>'rosterLocked' is distinct from 'true' and char_length(coalesce(new_class->>'rosterUnlockReason',''))<5 then raise exception 'Unlock reason required'; end if;
    end loop;
    for old_record in select value from jsonb_array_elements(previous->'registers') loop
      select value into new_record from jsonb_array_elements(next_state->'registers') where value->>'id'=old_record->>'id';
      if new_record is null then raise exception 'Historical registers cannot be deleted'; end if;
      if new_record->'roster'<>old_record->'roster' or new_record->>'date'<>old_record->>'date' or new_record->>'classId'<>old_record->>'classId' or new_record->>'className'<>old_record->>'className' or new_record->>'session'<>old_record->>'session' then raise exception 'Historical register identity is immutable'; end if;
      if old_record->>'status'='completed' and new_record<>old_record then
        if new_record->>'status'<>'in_progress' or char_length(coalesce(new_record->>'correctionReason',''))<5 or new_record->'entries'<>old_record->'entries' then raise exception 'Reopen with a reason before correcting a completed register'; end if;
      end if;
      if (new_record->'validations' @> old_record->'validations') is not true then raise exception 'Validation history must be preserved'; end if;
      if exists(select 1 from jsonb_array_elements(old_record->'validations') with ordinality v(item,n) where new_record->'validations'->((n-1)::integer) is distinct from item) then raise exception 'Validation order is immutable'; end if;
    end loop;
    if jsonb_array_length(next_state->'audit')<jsonb_array_length(previous->'audit') then raise exception 'Audit history cannot be shortened'; end if;
    if exists(select 1 from jsonb_array_elements(previous->'audit') with ordinality a(v,n) where next_state->'audit'->((n-1)::integer)<>v) then raise exception 'Audit history cannot be edited'; end if;
  end if;
  if (select count(*)<>count(distinct jsonb_build_array(x->>'date',x->>'classId',x->>'session')) from jsonb_array_elements(next_state->'registers') x) then raise exception 'Duplicate daily register'; end if;
  for new_record,index_record in select value,(ordinality-1)::integer from jsonb_array_elements(next_state->'registers') with ordinality loop
    select value into old_record from jsonb_array_elements(coalesce(previous->'registers','[]'::jsonb)) where value->>'id'=new_record->>'id';
    if new_record is not distinct from old_record then continue; end if;
    if not coalesce(new_record->>'date' ~ '^\d{4}-\d{2}-\d{2}$',false) or (new_record->>'date')::date::text<>new_record->>'date' then raise exception 'Invalid date'; end if;
    if new_record->>'status' is null or new_record->>'status' not in ('in_progress','completed') or jsonb_typeof(new_record->'roster') is distinct from 'array' or jsonb_typeof(new_record->'entries') is distinct from 'object' or jsonb_typeof(new_record->'validations') is distinct from 'array' then raise exception 'Invalid register'; end if;
    if (select count(*)<>count(distinct x->>'studentId') from jsonb_array_elements(new_record->'roster') x) then raise exception 'Duplicate pupil in register'; end if;
    if old_record is null then
      if not exists(select 1 from jsonb_array_elements(next_state->'classes') c where c->>'id'=new_record->>'classId' and c->>'active'='true' and c->>'name'=new_record->>'className') then raise exception 'Active official class required'; end if;
      if not exists(select 1 from jsonb_array_elements_text(next_state#>'{settings,sessions}') s where s=new_record->>'session') then raise exception 'Unknown session'; end if;
      select coalesce(jsonb_agg(x->>'studentId' order by x->>'studentId'),'[]'::jsonb) into old_roster from jsonb_array_elements(new_record->'roster') x;
      select coalesce(jsonb_agg(x->>'id' order by x->>'id'),'[]'::jsonb) into new_roster from jsonb_array_elements(next_state->'students') x where x->>'classId'=new_record->>'classId' and x->>'active'='true';
      if old_roster<>new_roster or jsonb_array_length(old_roster)=0 then raise exception 'The official class list is required'; end if;
      if exists(select 1 from jsonb_array_elements(new_record->'roster') rr where not exists(select 1 from jsonb_array_elements(next_state->'students') s where s->>'id'=rr->>'studentId' and s->>'name'=rr->>'name' and s->>'matricule'=rr->>'matricule' and coalesce(s->>'register','')=coalesce(rr->>'register',''))) then raise exception 'Official pupil names cannot be substituted'; end if;
      new_record=jsonb_set(jsonb_set(jsonb_set(new_record,'{createdAt}',to_jsonb(timestamp_now)),'{createdBy}',to_jsonb(auth.uid()::text)),'{createdByName}',to_jsonb(account.name));
    end if;
    for status_entry in select key,value from jsonb_each(new_record->'entries') loop
      if status_entry.value->>'status' not in ('present','absent','late','excused','sick') or status_entry.value->>'status' is null then raise exception 'Invalid presence status'; end if;
      if not exists(select 1 from jsonb_array_elements(new_record->'roster') x where x->>'studentId'=status_entry.key) then raise exception 'Pupil not in official register'; end if;
      if old_record->'entries'->status_entry.key is distinct from status_entry.value then
        new_record=jsonb_set(new_record,array['entries',status_entry.key],jsonb_build_object('status',status_entry.value->>'status','at',timestamp_now,'actorId',auth.uid()::text,'actorName',account.name));
      end if;
    end loop;
    if new_record->>'status'='completed' then
      if exists(select 1 from jsonb_array_elements(new_record->'roster') x where not (new_record->'entries' ? (x->>'studentId'))) then raise exception 'Complete every status before validation'; end if;
      if jsonb_array_length(new_record->'validations')<>coalesce(jsonb_array_length(old_record->'validations'),0)+1 then raise exception 'A new validation entry is required'; end if;
      new_record=jsonb_set(jsonb_set(new_record,'{validatedAt}',to_jsonb(timestamp_now)),'{validatedBy}',to_jsonb(account.name));
      validated=(new_record->'validations'->-1)||jsonb_build_object('at',timestamp_now,'actorId',auth.uid()::text,'actorName',account.name);
      new_record=jsonb_set(new_record,array['validations',(jsonb_array_length(new_record->'validations')-1)::text],validated);
    end if;
    new_record=jsonb_set(new_record,'{updatedAt}',to_jsonb(timestamp_now));
    changes=changes||jsonb_build_array(jsonb_build_object('registerId',new_record->>'id','before',old_record,'after',new_record));
    next_state=jsonb_set(next_state,array['registers',index_record::text],new_record);
  end loop;
  audit_index=coalesce(jsonb_array_length(previous->'audit'),0);
  while audit_index<jsonb_array_length(next_state->'audit') loop
    entry=next_state->'audit'->audit_index;
    entry=entry||jsonb_build_object('actorId',auth.uid()::text,'actorName',account.name,'at',timestamp_now);
    next_state=jsonb_set(next_state,array['audit',audit_index::text],entry);audit_index=audit_index+1;
  end loop;
  next_state=jsonb_set(jsonb_set(next_state,'{revision}',to_jsonb(current_revision+1)),'{updatedAt}',to_jsonb(timestamp_now));
  insert into public.ig2_registry(id,revision,payload,updated_by) values(1,current_revision+1,next_state,auth.uid())
    on conflict(id) do update set revision=excluded.revision,payload=excluded.payload,updated_by=excluded.updated_by,updated_at=now();
  insert into public.ig2_server_audit(actor_id,action,details) values(auth.uid(),'registry-commit',jsonb_build_object('revision',current_revision+1,'registerChanges',changes,'events',coalesce((select jsonb_agg(v) from jsonb_array_elements(next_state->'audit') with ordinality e(v,n) where n>coalesce(jsonb_array_length(previous->'audit'),0)),'[]'::jsonb)));
  return next_state;
end; $$;

create or replace function public.ig2_parent_view(p_day date) returns jsonb language plpgsql security definer set search_path='' as $$
declare account public.ig2_accounts; state jsonb; children jsonb;
begin
  account=public.ig2_require_access('parent');
  select payload into state from public.ig2_registry where id=1;
  select coalesce(jsonb_agg(jsonb_build_object(
    'id',s->>'id','name',s->>'name','matricule',s->>'matricule','classId',s->>'classId',
    'className',(select c->>'name' from jsonb_array_elements(state->'classes') c where c->>'id'=s->>'classId'),
    'observations',coalesce((select jsonb_agg(jsonb_build_object('date',r->>'date','session',r->>'session','classId',r->>'classId','className',r->>'className','studentName',(select rr->>'name' from jsonb_array_elements(r->'roster') rr where rr->>'studentId'=s->>'id'),'studentMatricule',(select rr->>'matricule' from jsonb_array_elements(r->'roster') rr where rr->>'studentId'=s->>'id'),'status',coalesce(r->'entries'->(s->>'id')->>'status','unset'),'recordedAt',r->'entries'->(s->>'id')->>'at','recordedBy',r->'entries'->(s->>'id')->>'actorName','state',r->>'status','validatedAt',r->>'validatedAt') order by r->>'session') from jsonb_array_elements(state->'registers') r where r->>'date'=p_day::text and exists(select 1 from jsonb_array_elements(r->'roster') rr where rr->>'studentId'=s->>'id')),'[]'::jsonb)
  ) order by s->>'name'),'[]'::jsonb) into children
  from jsonb_array_elements(coalesce(state->'students','[]'::jsonb)) s
  where exists(select 1 from public.ig2_parent_links l where l.parent_id=auth.uid() and l.active and l.student_id=s->>'id');
  return jsonb_build_object('schoolName',state#>>'{settings,schoolName}','day',p_day,'serverTime',now(),'children',children);
end; $$;

create or replace function public.ig2_authorize_admin(p_email text,p_handle text) returns jsonb language plpgsql security definer set search_path='' as $$
begin
  perform public.ig2_require_access('admin');
  if p_handle !~ '^@[A-Za-z0-9][A-Za-z0-9._-]{1,38}@$' or p_email !~ '^[^@ ]+@[^@ ]+\.[^@ ]+$' then raise exception 'Invalid email or identifier'; end if;
  insert into public.ig2_admin_allowlist(email,handle,authorized_by) values(lower(btrim(p_email)),btrim(p_handle),auth.uid()) on conflict(email) do update set handle=excluded.handle,active=true,authorized_by=auth.uid();
  insert into public.ig2_server_audit(actor_id,action,details) values(auth.uid(),'admin-authorized',jsonb_build_object('email',lower(btrim(p_email)),'handle',p_handle));
  return jsonb_build_object('authorized',true,'emailSent',false);
end; $$;

create or replace function public.ig2_link_parent(p_email text,p_student_id text,p_enabled boolean default true) returns jsonb language plpgsql security definer set search_path='' as $$
declare parent uuid; state jsonb;
begin
  perform public.ig2_require_access('admin');
  select a.user_id into parent from public.ig2_accounts a join auth.users u on u.id=a.user_id where lower(u.email)=lower(btrim(p_email)) and a.role='parent' and a.active and u.email_confirmed_at is not null;
  if parent is null then raise exception 'Parent must register, confirm email and sign in first'; end if;
  select payload into state from public.ig2_registry where id=1;
  if not exists(select 1 from jsonb_array_elements(state->'students') s where s->>'id'=p_student_id) then raise exception 'Unknown pupil'; end if;
  insert into public.ig2_parent_links(parent_id,student_id,active,granted_by) values(parent,p_student_id,p_enabled,auth.uid()) on conflict(parent_id,student_id) do update set active=excluded.active,granted_by=auth.uid(),granted_at=now();
  insert into public.ig2_server_audit(actor_id,action,details) values(auth.uid(),'parent-link',jsonb_build_object('parent',parent,'student',p_student_id,'active',p_enabled));
  return jsonb_build_object('saved',true);
end; $$;

create or replace function public.ig2_list_access() returns jsonb language plpgsql security definer set search_path='' as $$
begin
  perform public.ig2_require_access('admin');
  return jsonb_build_object('accounts',coalesce((select jsonb_agg(jsonb_build_object('id',a.user_id,'name',a.name,'handle',a.handle,'role',a.role,'active',a.active,'email',u.email)) from public.ig2_accounts a join auth.users u on u.id=a.user_id),'[]'::jsonb),'links',coalesce((select jsonb_agg(to_jsonb(l)) from public.ig2_parent_links l),'[]'::jsonb),'invitations',coalesce((select jsonb_agg(jsonb_build_object('email',email,'handle',handle,'active',active)) from public.ig2_admin_allowlist),'[]'::jsonb));
end; $$;

create or replace function public.ig2_set_account_active(p_user_id uuid,p_active boolean) returns jsonb language plpgsql security definer set search_path='' as $$
declare target public.ig2_accounts;
begin
  perform public.ig2_require_access('admin');perform pg_advisory_xact_lock(947202);
  select * into target from public.ig2_accounts where user_id=p_user_id for update;
  if not found then raise exception 'Unknown account'; end if;
  if not p_active and target.role='admin' and (select count(*) from public.ig2_accounts where role='admin' and active)<=1 then raise exception 'Keep at least one active administrator'; end if;
  update public.ig2_accounts set active=p_active where user_id=p_user_id;
  insert into public.ig2_server_audit(actor_id,action,details) values(auth.uid(),'account-active',jsonb_build_object('userId',p_user_id,'active',p_active));
  return jsonb_build_object('saved',true);
end; $$;

revoke all on function public.ig2_protocol() from public;
grant execute on function public.ig2_protocol() to anon,authenticated;
revoke all on function public.ig2_require_access(text) from public,anon,authenticated;
revoke all on function public.ig2_claim_access(text,text),public.ig2_read_state(),public.ig2_commit_state(bigint,jsonb),public.ig2_parent_view(date),public.ig2_authorize_admin(text,text),public.ig2_link_parent(text,text,boolean),public.ig2_list_access(),public.ig2_set_account_active(uuid,boolean) from public,anon;
grant execute on function public.ig2_claim_access(text,text),public.ig2_read_state(),public.ig2_commit_state(bigint,jsonb),public.ig2_parent_view(date),public.ig2_authorize_admin(text,text),public.ig2_link_parent(text,text,boolean),public.ig2_list_access(),public.ig2_set_account_active(uuid,boolean) to authenticated;
commit;
`;
  async function start(){
    try{
      connection.config=readConnectionConfig();connection.mode=connection.config?'connected':'local';
      try{if(!globalThis.indexedDB)throw new Error('IndexedDB est indisponible.');repository=new LocalRepository();await repository.open();db=await repository.read();connection.localRepository=repository;}catch(error){if(!connection.config)throw new Error('Le stockage local est indisponible. Ouvrez ce fichier dans Chrome hors navigation priv\u00e9e ou utilisez le fichier HTTPS connect\u00e9 de votre \u00e9cole.');db=null;repository=null;}
      if(db)validateBackup(db,{copy:false});else db=emptySchool();if(connection.mode==='connected')db=emptySchool();
      currentUserId=null;
      try{sessionStorage.removeItem('ig2-profile');}catch{}
      if(/[&#](?:access_token|refresh_token|code)=/.test(location.href))try{history.replaceState(null,'',location.pathname);}catch{}
      ui.session=db.settings.sessions[0];ui.callSession=db.settings.sessions[0];ui.reportSession='';ui.settingsDirty=false;
      try{channel=new BroadcastChannel('ig2-presences-changes');channel.onmessage=event=>{if(event.data?.type==='changed')refreshFromOtherTab();};}catch{}
      renderAuth();
    }catch(error){$('#app').innerHTML=`<div class="auth-screen"><div class="auth-inner"><div class="empty-icon">${icon('alert')}</div><h1>Le registre n'a pas pu s'ouvrir</h1><p>${esc(error.message || 'Stockage local indisponible.')}</p><div class="note warning">${icon('shield')}Les donn&eacute;es existantes n'ont pas &eacute;t&eacute; effac&eacute;es ou remplac&eacute;es. N'effacez pas le stockage du navigateur avant d'avoir sauvegard&eacute; vos donn&eacute;es.</div><div class="form-actions">${db?btn('Exporter pour r\u00e9cup\u00e9ration','rescue-backup','download'):''}${btn('R\u00e9essayer','retry-init','refresh','btn-primary')}</div><div class="auth-footer"><button class="text-link" data-action="help">Aide & limites techniques</button></div></div></div>`;}
  }
  start();
